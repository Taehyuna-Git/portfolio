name: Update Shingu meal menu

on:
  schedule:
    # 한국 시간 평일 오전 6시 17분
    - cron: "17 21 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 학교 식단 가져오기
        run: node scripts/update-meals.mjs

      - name: 변경된 식단 저장
        run: |
          if git diff --quiet -- data/; then
            echo "식단 변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/meals.json data/meals.js
          git commit -m "식단 자동 업데이트"
          git push

      - name: 공개 사이트 새로고침 요청
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true
